set timeout=5
set default=0

insmod all_video
insmod efi_gop
insmod gfxterm
insmod png
insmod font

set gfxmode=1024x768
set gfxpayload=keep

loadfont ($root)/boot/grub/themes/sovern/fonts/unicode.pf2

terminal_output gfxterm

set theme=($root)/boot/grub/themes/sovern/theme.txt
export theme

background_image ($root)/boot/grub/themes/sovern/background.png


menuentry "Start SOVERN OS" {
    echo "Booting..."
}

menuentry "Recovery Environment" {
    echo "Recovery"
}

menuentry "Diagnostics" {
    echo "Diagnostics"
}

submenu "System Tools" {

    menuentry "Firmware Setup" {
        fwsetup
    }

    menuentry "Restart" {
        reboot
    }

    menuentry "Shutdown" {
        halt
    }
}