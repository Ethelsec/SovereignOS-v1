set timeout=10
set default=0

insmod part_gpt
insmod fat
insmod search_fs_file

search --file /boot/grub/grub.cfg --set=root
set prefix=($root)/boot/grub

# -------- VIDEO FIRST --------
insmod efi_gop
insmod all_video
insmod video_fb
insmod gfxterm

set gfxmode=1920x1080
set gfxpayload=keep
terminal_output gfxterm

insmod png
insmod font

loadfont ($root)/boot/grub/fonts/unicode.pf2

export gfxmode

# -------- THEME LAST (IMPORTANT) --------
set theme=($root)/boot/grub/themes/sovern/theme.txt
export theme

menuentry "Start SOVERN OS" {
    echo "Starting SOVERN OS..."
}

submenu "Advanced SOVERN OS" {
    menuentry "Recovery Mode" { echo "Recovery Mode" }
    menuentry "EFI Shell" { echo "EFI Shell not installed" }
    menuentry "Hardware Information" { lspci }
}

submenu "GRUB Settings" {
    menuentry "Reboot System" { reboot }
    menuentry "Shutdown System" { halt }
    menuentry "UEFI Firmware Setup" { fwsetup }
}